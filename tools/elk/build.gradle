// The layout engine for bin/graph: Eclipse ELK's layered algorithm, the Java
// original rather than the elkjs transpile.  Reads ELK JSON on stdin, writes the
// laid-out graph as ELK JSON on stdout.  Pinned so a re-run lays out identically.
plugins { id 'java'; id 'application' }
repositories { mavenCentral() }
def elk = '0.12.0'
dependencies {
    implementation "org.eclipse.elk:org.eclipse.elk.alg.layered:${elk}"
    implementation "org.eclipse.elk:org.eclipse.elk.graph.json:${elk}"
}
application { mainClass = 'Layout' }
